name: Build APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y python3-pip build-essential git python3 python3-dev \
          libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev \
          zlib1g-dev libsqlite3-dev sqlite3 libssl-dev bzip2 libbz2-dev \
          liblzma-dev libffi-dev libgdbm-dev libncursesw5-dev \
          libreadline-dev uuid-dev libopenjp2-7-dev libtiff5-dev autoconf libtool pkg-config
          pip3 install --user --upgrade Cython==0.29.33 buildozer

      - name: Build with Buildozer
        run: |
          export PATH=$PATH:$HOME/.local/bin
          # 빌드 전 청소 후, 한 가지 아키텍처만 집중 빌드
          buildozer android clean
          yes | buildozer -v android debug
        
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LogisticsGPS-APK
          path: bin/*.apk
