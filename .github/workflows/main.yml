name: Build APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          # 필수 빌드 도구만 엄선하여 설치 (충돌 방지)
          sudo apt install -y python3-pip build-essential git python3 python3-dev \
          libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev \
          zlib1g-dev libsqlite3-dev sqlite3 libssl-dev bzip2 libbz2-dev \
          liblzma-dev libffi-dev libgdbm-dev libncursesw5-dev \
          libreadline-dev uuid-dev libopenjp2-7-dev libtiff5-dev \
          autoconf libtool pkg-config
          pip3 install --user --upgrade Cython==0.29.33 buildozer

      - name: Build with Buildozer
        run: |
          export PATH=$PATH:$HOME/.local/bin
          # 1. 이전 찌꺼기 제거
          rm -rf .buildozer
          # 2. 딱 한 가지 아키텍처(최신폰용)만 타겟팅하여 서버 부하 50% 감소
          # 3. yes | 대신 환경변수 승인 방식을 사용하여 Broken pipe 원천 차단
          buildozer android debug --android.archs=arm64-v8a
        env:
          APP_ANDROID_ACCEPT_SDK_LICENSE: "1"
          GRADLE_OPTS: "-Dorg.gradle.daemon=false" # 메모리 부족 방지

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LogisticsGPS-Final-APK
          path: bin/*.apk
